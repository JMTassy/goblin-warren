freeze_law: >
  No edits to cases.test.jsonl, rubric.yaml, procedures.yaml,
  forbidden-morphisms.yaml, or RESULTS_AB_haiku_2026-07-10.md without a new
  version, new hashes, and a new benchmark run. Any change creates a V2
  artifact — never silent mutation of V1.
interpretation: >
  The manual is a behavioral membrane, not a reasoning transplant. Its main
  measured effect: free-form claim -> typed epistemic object
  (WITNESSED/REPORTED/CANDIDATE/NEEDS_ME). It does not copy intelligence;
  it introduces a claim type system. Deploy at the execution boundary
  (base model -> task context -> evidence-discipline skill -> tools ->
  receipt check -> operator gate), never as one huge global prompt.
