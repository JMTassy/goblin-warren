<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Day 1 — Help the Garden</title>
<!--
  authority=false · claim=NO_CLAIM · experience before terminology
  Animation upgrade: icon chain replaces text feed · day1_sim.js unchanged
-->
<style>
  :root {
    --bg: #0c1410;
    --panel: #142018;
    --ink: #e8f0e4;
    --dim: #8aa090;
    --gold: #e6b84a;
    --green: #6ecf7a;
    --warn: #e07a6a;
    --pulse: #a8d858;
    --edge: #2a4030;
    --blue: #6ab4d0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, sans-serif; padding: 16px;
    max-width: 720px; margin-inline: auto;
  }
  h1 { font-size: 1.15rem; color: var(--gold); margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 0.85rem; margin-bottom: 10px; }
  .meter { font-size: 0.85rem; color: var(--dim); margin-bottom: 8px; min-height: 20px; }

  /* ── STAGE ─────────────────────────────────────────────── */
  .stage {
    position: relative; height: 250px;
    background: #0a120e; border: 1px solid var(--edge);
    border-radius: 12px; overflow: hidden; margin: 8px 0;
  }
  .zone-box {
    position: absolute; top: 8px; bottom: 8px; width: 44%;
    border-radius: 10px; border: 1px solid var(--edge);
    overflow: hidden;
  }
  .zone-box.garden  { left: 4%;
    background: #0d1e14 url("assets/collage_stills/wall_garden.png") center/cover no-repeat; }
  .zone-box.archive { right: 4%;
    background: #160e14 url("assets/collage_stills/wall_archive.png") center/cover no-repeat; }
  .zone-label {
    display: inline-block; margin: 6px 0 0 6px; padding: 3px 9px;
    font-size: 0.63rem; border-radius: 6px;
    text-transform: uppercase; letter-spacing: 0.07em; color: #e8f0e4;
    background: rgba(10, 18, 14, 0.65);
  }

  /* need badges positioned in stage */
  .need-badge {
    position: absolute;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    user-select: none;
  }
  .badge-icon { font-size: 1.45rem; line-height: 1; transition: filter 0.3s; }
  .badge-icon img {
    display: block; width: 52px; height: auto;
    filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.45));
    transition: filter 0.3s;
  }
  .badge-warn {
    font-size: 0.6rem; color: var(--warn); min-height: 12px;
    opacity: 0; transition: opacity 0.35s;
    letter-spacing: -0.04em;
  }
  .need-badge.has-warning .badge-warn { opacity: 1; }
  .need-badge.glowing .badge-icon {
    filter: drop-shadow(0 0 5px #e07a6a) drop-shadow(0 0 14px #e07a6a88);
  }
  .need-badge.resolved .badge-icon { filter: brightness(1.3) saturate(1.4); }
  .badge-check {
    position: absolute; top: -7px; right: -7px;
    font-size: 0.68rem; color: var(--green);
    background: #0a1810; border-radius: 50%;
    width: 15px; height: 15px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--green);
    opacity: 0; transition: opacity 0.3s;
  }
  .need-badge.resolved .badge-check { opacity: 1; }

  /* agents — paper cutout sprites */
  .agent {
    position: absolute; bottom: 14px; width: 58px;
    transition: left 0.55s cubic-bezier(0.4,0,0.2,1),
                bottom 0.55s cubic-bezier(0.4,0,0.2,1),
                filter 0.3s, opacity 0.3s;
  }
  .agent img {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(3px 4px 4px rgba(0,0,0,0.5));
    transition: filter 0.3s;
  }
  .agent.bram { left: 20%; }
  .agent.lulu { left: 34%; width: 50px; }
  .agent.working img {
    filter: drop-shadow(3px 4px 4px rgba(0,0,0,0.5))
            drop-shadow(0 0 9px #a8d858);
  }
  .agent.resting { opacity: 0.6; }

  /* pulse dot */
  .trace-pulse {
    position: absolute; width: 18px; height: 18px;
    border-radius: 50%; background: var(--warn);
    opacity: 0; pointer-events: none;
  }
  .trace-pulse.fire { animation: radiate 0.65s ease-out forwards; }
  @keyframes radiate {
    0%   { opacity: 1; transform: scale(0.4);
           box-shadow: 0 0 0 0 rgba(224,122,106,0.9); }
    100% { opacity: 0; transform: scale(2.8);
           box-shadow: 0 0 0 22px rgba(224,122,106,0); }
  }

  /* repair / intervene burst */
  .burst {
    position: absolute; font-size: 1.4rem;
    opacity: 0; pointer-events: none;
  }
  .burst.fire { animation: burstUp 0.7s ease-out forwards; }
  @keyframes burstUp {
    0%   { opacity: 1; transform: scale(0.7) translateY(0); }
    55%  { opacity: 1; transform: scale(1.5) translateY(-8px); }
    100% { opacity: 0; transform: scale(1.0) translateY(-20px); }
  }

  /* ── ICON STRIP ─────────────────────────────────────────── */
  .strip-wrap {
    background: #0a120e; border: 1px solid var(--edge); border-radius: 10px;
    padding: 10px 14px; margin: 8px 0;
    display: flex; align-items: center; min-height: 54px;
    gap: 10px;
  }
  .strip-label {
    font-size: 0.62rem; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--dim);
    flex-shrink: 0;
  }
  .icon-strip {
    display: flex; flex-wrap: wrap; gap: 3px; align-items: center;
    flex: 1;
  }
  .ev-icon {
    font-size: 1.3rem; cursor: default;
    opacity: 0; animation: popIn 0.22s forwards;
    position: relative; display: inline-block;
  }
  .ev-arrow {
    font-size: 0.72rem; color: var(--dim);
    opacity: 0; animation: popIn 0.22s forwards;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.6) translateY(3px); }
    to   { opacity: 1; transform: scale(1)   translateY(0); }
  }
  .ev-icon:hover::after {
    content: attr(title);
    position: absolute; bottom: calc(100% + 5px); left: 50%;
    transform: translateX(-50%);
    background: #1a2820; border: 1px solid var(--edge);
    border-radius: 6px; padding: 4px 9px;
    font-size: 0.7rem; color: var(--ink);
    white-space: nowrap; z-index: 20; pointer-events: none;
  }
  .strip-idle {
    font-size: 0.78rem; color: var(--dim);
    opacity: 0; animation: popIn 0.25s 0.05s forwards;
  }

  /* ── NEEDS CARDS ────────────────────────────────────────── */
  .needs-row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .need-card {
    flex: 1 1 110px; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 10px; padding: 10px 12px; cursor: pointer;
    transition: border-color 0.18s, box-shadow 0.18s, opacity 0.2s;
    min-width: 100px; position: relative;
  }
  .need-card:hover:not(.resolved):not(.blocked):not(.selected) {
    border-color: #3a6040;
  }
  .need-card.selected {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold);
  }
  .need-card.resolved  { opacity: 0.45; cursor: default; }
  .need-card.blocked   { opacity: 0.35; cursor: not-allowed; }
  .nc-icon  { font-size: 1.4rem; margin-bottom: 4px; }
  .nc-name  { font-size: 0.78rem; font-weight: 600; }
  .nc-zone  { font-size: 0.67rem; color: var(--dim); }
  .nc-sig   { font-size: 0.63rem; color: var(--warn); margin-top: 3px; letter-spacing: -0.04em; }
  .nc-done  { font-size: 0.67rem; color: var(--green); margin-top: 3px; }

  /* ── ACTIONS ────────────────────────────────────────────── */
  .action-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  button {
    background: #1e3a28; color: var(--ink); border: 1px solid var(--edge);
    border-radius: 8px; padding: 10px 15px; font: 600 0.88rem system-ui;
    cursor: pointer; transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: #254830; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.mark { background: #3a2810; border-color: #7a5020; color: #f0c870; }
  button.mark:hover:not(:disabled) { background: #4a3014; }
  button.fix  { background: #1c3828; border-color: #2e5838; }
  button.end  { background: #2c4220; border-color: #3c5e30; color: #c8e8a0; }

  .queue-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; min-height: 18px; }
  .q-chip {
    font-size: 0.73rem; padding: 3px 9px;
    border-radius: 6px; border: 1px solid var(--edge); background: #1a2820;
  }
  .q-chip.mark-chip { border-color: #7a5020; color: #f0c870; }
  .q-chip.fix-chip  { border-color: #2e5838; color: var(--green); }

  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px; }
  .presets button { font-size: 0.77rem; padding: 7px 10px; }
</style>
</head>
<body>

<h1>Day 1 — Help the Garden</h1>
<p class="sub">Two actions today. Mark a problem so Bram finds it — or fix it yourself.</p>

<div class="meter" id="meter">Pick a need, then choose what to do.</div>

<!-- STAGE -->
<div class="stage" id="stage" aria-label="Garden and Archive zones">
  <div class="zone-box garden">
    <div class="zone-label">Garden</div>
  </div>
  <div class="zone-box archive">
    <div class="zone-label">Archive</div>
  </div>
  <!-- badges injected by JS -->
  <div class="agent bram" id="bram" title="Bram — repairs what looks dangerous"><img src="assets/collage_stills/cut/bram.png" alt="Bram" /></div>
  <div class="agent lulu" id="lulu" title="Lulu — watches, never fixes"><img src="assets/collage_stills/cut/lulu.png" alt="Lulu" /></div>
  <div class="trace-pulse" id="pulse"></div>
  <div class="burst" id="burst">✨</div>
</div>

<!-- ICON STRIP -->
<div class="strip-wrap">
  <span class="strip-label">Today</span>
  <div class="icon-strip" id="icon-strip">
    <span class="strip-idle">Nothing yet. Pick a need below.</span>
  </div>
</div>

<!-- NEEDS -->
<div class="needs-row" id="needs"></div>

<!-- ACTIONS -->
<div class="action-row">
  <button type="button" class="mark" id="btnMark"      disabled>✨ Mark it</button>
  <button type="button" class="fix"  id="btnIntervene" disabled>✋ Fix it myself</button>
  <button type="button"              id="btnUndo"       disabled>↩ Undo</button>
  <button type="button" class="end"  id="btnRun"        disabled>End the day →</button>
  <button type="button"              id="btnReset">↺ Start over</button>
</div>
<div class="queue-row" id="queueRow"></div>

<!-- PRESETS -->
<div class="presets">
  <button type="button" id="pathA">Path A: Mark root + Fix seedlings</button>
  <button type="button" id="pathB">Path B: Fix root + Fix seedlings</button>
</div>

<script src="day1_sim.js"></script>
<script>
(function () {
  "use strict";
  var S = window.Day1Sim;
  if (!S) {
    document.getElementById("icon-strip").textContent = "day1_sim.js failed to load.";
    return;
  }

  /* ── need / stage metadata ───────────────────────────── */
  var ART = "assets/collage_stills/cut/";
  var NEED_META = {
    dry_seedlings: { label: "Dry seedlings", icon: "🌱", zone: "Garden",
                     img: "seedlings_dry.png", imgDone: "seedlings_bloomed.png" },
    cracked_root:  { label: "Cracked root",  icon: "🪨", zone: "Garden",
                     img: "rock_cracked.png" },
    fading_memory: { label: "Fading memory", icon: "📜", zone: "Archive",
                     img: "scroll_fading.png" },
  };

  // Position inside the stage (percentage of stage box)
  var STAGE_POS = {
    dry_seedlings: { left: "28%", top: "52%" },
    cracked_root:  { left: "14%", top: "28%" },
    fading_memory: { left: "68%", top: "34%" },
  };

  var BRAM_HOME = { left: "20%", bottom: "14px" };
  var LULU_HOME = { left: "34%", bottom: "14px" };

  /* ── event → icon + tooltip ─────────────────────────── */
  var EV_ICON = {
    MARK_PULSE:           "✨",
    TRACE_STRENGTHEN:     "⚠️",
    INTERVENE:            "✋",
    LULU_REACT:           "🌟",
    LULU_WATCH:           "👁️",
    LULU_WAIT:            "💤",
    BRAM_NOTICE:          "👀",
    BRAM_PATH:            "👣",
    BRAM_REPAIR_START:    "🛠️",
    BRAM_REPAIR_COMPLETE: "🌱",
    BRAM_SIGNAL_FAINT:    "🔇",
    INTERVENE_FAILED:     "🚫",
    BRAM_IDLE:            "😴",
  };

  function tip(ev) {
    var m = NEED_META[ev.needId] || {};
    var n = m.label || "";
    switch (ev.kind) {
      case "MARK_PULSE":           return "Mark " + n + " — a pulse spreads.";
      case "TRACE_STRENGTHEN":     return "Warning near " + n + " grows (signal " + ev.strength + ").";
      case "INTERVENE":            return "Fix " + n + " yourself. Done.";
      case "LULU_REACT":           return "Lulu notices the shimmer.";
      case "LULU_WATCH":           return "Lulu watches. Does not fix.";
      case "LULU_WAIT":            return "Lulu waits.";
      case "BRAM_NOTICE":          return "Bram sees the danger-sign.";
      case "BRAM_PATH":            return "Bram heads toward " + n + ".";
      case "BRAM_REPAIR_START":    return "Bram starts repairing.";
      case "BRAM_REPAIR_COMPLETE": return "Bram finishes. " + n + " is fixed.";
      case "BRAM_SIGNAL_FAINT":    return "Bram hears only a faint warning — mark it louder.";
      case "INTERVENE_FAILED":     return "Not enough " + (ev.material || "materials") + " to fix " + n + " yourself.";
      case "BRAM_IDLE":            return "Bram finds nothing to repair.";
      default: return ev.kind;
    }
  }

  /* ── state ───────────────────────────────────────────── */
  var base         = S.makeInitialState();
  var picks        = [];
  var selectedNeed = null;
  var lastResult   = null;
  var animBusy     = false;
  var badges       = {};  // needId → DOM element

  /* ── stage badges ────────────────────────────────────── */
  function initBadges() {
    var stage = document.getElementById("stage");
    Object.keys(badges).forEach(function (id) {
      if (badges[id].parentNode) badges[id].parentNode.removeChild(badges[id]);
    });
    badges = {};
    Object.keys(NEED_META).forEach(function (id) {
      var pos = STAGE_POS[id];
      var el = document.createElement("div");
      el.className = "need-badge";
      el.style.left = pos.left;
      el.style.top  = pos.top;
      el.innerHTML =
        '<div class="badge-icon"><img id="bimg-' + id + '" src="' + ART + NEED_META[id].img + '" alt="' + NEED_META[id].label + '" /></div>' +
        '<div class="badge-warn" id="bw-' + id + '"></div>' +
        '<div class="badge-check">✓</div>';
      badges[id] = el;
      stage.appendChild(el);
    });
  }

  function syncBadges(state) {
    Object.keys(NEED_META).forEach(function (id) {
      var b = badges[id];
      if (!b) return;
      var n = state.needs[id];
      b.classList.toggle("resolved", !!n.resolved);
      var warnStr = 0;
      Object.keys(state.traces).forEach(function (tid) {
        var t = state.traces[tid];
        if (t.needId === id && t.type === "warning") warnStr = t.strength;
      });
      b.classList.toggle("has-warning", warnStr > 0 && !n.resolved);
      var bw = document.getElementById("bw-" + id);
      if (bw) bw.textContent = warnStr > 2 ? "⚠️⚠️" : warnStr > 0 ? "⚠️" : "";
      b.classList.remove("glowing");
    });
  }

  /* ── stage animation helpers ─────────────────────────── */
  function swapDoneArt(needId) {
    var meta = NEED_META[needId];
    if (!meta || !meta.imgDone) return;
    var img = document.getElementById("bimg-" + needId);
    if (img) img.src = ART + meta.imgDone;
  }

  function resetAgents() {
    var bram = document.getElementById("bram");
    var lulu = document.getElementById("lulu");
    bram.style.left   = BRAM_HOME.left;
    bram.style.bottom = BRAM_HOME.bottom;
    bram.classList.remove("working", "resting");
    lulu.style.left   = LULU_HOME.left;
    lulu.style.bottom = LULU_HOME.bottom;
    lulu.classList.remove("working", "resting");
  }

  function firePulse(needId) {
    var pos = STAGE_POS[needId];
    var p = document.getElementById("pulse");
    p.style.left = "calc(" + pos.left + " - 9px)";
    p.style.top  = "calc(" + pos.top  + " + 16px)";
    p.classList.remove("fire");
    void p.offsetWidth;
    p.classList.add("fire");
    if (badges[needId]) {
      badges[needId].classList.add("glowing");
      setTimeout(function () {
        if (badges[needId]) badges[needId].classList.remove("glowing");
      }, 900);
    }
  }

  function fireBurst(needId) {
    var pos = STAGE_POS[needId];
    var b = document.getElementById("burst");
    b.style.left = "calc(" + pos.left + " + 2px)";
    b.style.top  = "calc(" + pos.top  + " - 8px)";
    b.classList.remove("fire");
    void b.offsetWidth;
    b.classList.add("fire");
  }

  function stageAnim(ev) {
    switch (ev.kind) {
      case "MARK_PULSE":
        firePulse(ev.needId);
        break;
      case "TRACE_STRENGTHEN": {
        var bwEl = document.getElementById("bw-" + ev.needId);
        if (bwEl) {
          var th = (S.BRAM_ACT_THRESHOLD || 3);
          bwEl.textContent = ev.strength >= th ? "⚠️⚠️" : "⚠️";
        }
        if (badges[ev.needId]) {
          badges[ev.needId].classList.add("glowing");
          badges[ev.needId].classList.add("has-warning");
          setTimeout(function () {
            if (badges[ev.needId]) badges[ev.needId].classList.remove("glowing");
          }, 600);
        }
        break;
      }
      case "INTERVENE":
        fireBurst(ev.needId);
        setTimeout(function () {
          if (badges[ev.needId]) badges[ev.needId].classList.add("resolved");
          swapDoneArt(ev.needId);
        }, 280);
        break;
      case "BRAM_PATH": {
        var bram = document.getElementById("bram");
        var pos = STAGE_POS[ev.needId];
        var lft = parseFloat(pos.left);
        bram.style.left = (lft + 3) + "%";
        bram.classList.add("working");
        break;
      }
      case "BRAM_REPAIR_COMPLETE":
        fireBurst(ev.needId);
        setTimeout(function () {
          if (badges[ev.needId]) badges[ev.needId].classList.add("resolved");
          swapDoneArt(ev.needId);
          var br = document.getElementById("bram");
          br.classList.remove("working");
        }, 280);
        break;
      case "BRAM_SIGNAL_FAINT":
      case "BRAM_IDLE":
        document.getElementById("bram").classList.add("resting");
        break;
      case "LULU_REACT":
        document.getElementById("lulu").classList.add("working");
        setTimeout(function () {
          document.getElementById("lulu").classList.remove("working");
        }, 700);
        break;
    }
  }

  /* ── icon strip ──────────────────────────────────────── */
  var STEP_MS = 300;

  function animStrip(events) {
    var strip = document.getElementById("icon-strip");
    strip.innerHTML = "";
    var total = events.length;
    events.forEach(function (ev, i) {
      setTimeout(function () {
        if (i > 0) {
          var arr = document.createElement("span");
          arr.className = "ev-arrow";
          arr.textContent = "→";
          strip.appendChild(arr);
        }
        var sp = document.createElement("span");
        sp.className = "ev-icon";
        sp.textContent = EV_ICON[ev.kind] || "•";
        sp.title = tip(ev);
        strip.appendChild(sp);
        stageAnim(ev);
        if (i === total - 1) {
          setTimeout(function () { animBusy = false; }, 120);
        }
      }, i * STEP_MS);
    });
    if (!total) animBusy = false;
  }

  /* ── needs cards ─────────────────────────────────────── */
  function renderNeeds() {
    var el = document.getElementById("needs");
    var state = lastResult || base;
    var preview = picks.length ? S.runDay(base, picks) : null;
    var NeedIds = ["cracked_root", "dry_seedlings", "fading_memory"];
    el.innerHTML = NeedIds.map(function (id) {
      var meta = NEED_META[id];
      var n = state.needs[id];
      var resolvedInPlan = preview ? preview.needs[id].resolved : n.resolved;

      var cls = "need-card";
      if (resolvedInPlan)       cls += " resolved";
      else if (selectedNeed === id && !lastResult) cls += " selected";
      else if (lastResult)      cls += " blocked";

      var sigHtml = "";
      Object.keys(state.traces).forEach(function (tid) {
        var t = state.traces[tid];
        if (t.needId === id && t.type === "warning") {
          var dots = "";
          for (var k = 0; k < Math.min(t.strength, 4); k++) dots += "⚠";
          sigHtml = '<div class="nc-sig">' + dots + " signal</div>";
        }
      });
      var doneHtml = resolvedInPlan ? '<div class="nc-done">✓ addressed</div>' : "";

      return (
        '<div class="' + cls + '" data-id="' + id + '">' +
        '<div class="nc-icon">' + meta.icon + '</div>' +
        '<div class="nc-name">' + meta.label + '</div>' +
        '<div class="nc-zone">' + meta.zone + '</div>' +
        sigHtml + doneHtml +
        '</div>'
      );
    }).join("");

    el.querySelectorAll(".need-card").forEach(function (node) {
      node.addEventListener("click", function () {
        if (lastResult || animBusy) return;
        var id = node.getAttribute("data-id");
        var preview2 = S.runDay(base, picks);
        if (preview2.needs[id].resolved) return;
        selectedNeed = id;
        render();
      });
    });
  }

  /* ── meter ───────────────────────────────────────────── */
  function renderMeter() {
    var m = document.getElementById("meter");
    if (lastResult) {
      var repaired = lastResult.events.some(function (e) { return e.kind === "BRAM_REPAIR_COMPLETE"; });
      m.textContent = repaired
        ? "Bram heard the signal and repaired the root."
        : "Day ended. Bram found nothing to follow.";
      return;
    }
    var rem = S.MAX_ACTIONS - picks.length;
    if (!picks.length) m.textContent = "Pick a need, then choose what to do.";
    else if (rem === 1) m.textContent = "One action left.";
    else m.textContent = "Both actions queued. End the day when ready.";
  }

  /* ── queue chips ─────────────────────────────────────── */
  function renderQueue() {
    var el = document.getElementById("queueRow");
    if (!picks.length || lastResult) { el.innerHTML = ""; return; }
    el.innerHTML = picks.map(function (a) {
      var meta = NEED_META[a.target];
      var cls = a.verb === "MARK" ? "q-chip mark-chip" : "q-chip fix-chip";
      var pfx = a.verb === "MARK" ? "✨ Mark" : "✋ Fix";
      return '<span class="' + cls + '">' + pfx + " " + meta.label + '</span>';
    }).join("");
  }

  /* ── buttons ─────────────────────────────────────────── */
  function renderButtons() {
    var hasSel = !!selectedNeed && !lastResult && !animBusy;
    var rem    = S.MAX_ACTIONS - picks.length;
    document.getElementById("btnMark").disabled      = !hasSel || rem <= 0;
    document.getElementById("btnIntervene").disabled = !hasSel || rem <= 0;
    document.getElementById("btnUndo").disabled      = !picks.length || !!lastResult || animBusy;
    document.getElementById("btnRun").disabled       = picks.length === 0 || !!lastResult || animBusy;
  }

  /* ── master render ───────────────────────────────────── */
  function render() {
    renderMeter();
    renderNeeds();
    renderQueue();
    renderButtons();
  }

  /* ── full reset ──────────────────────────────────────── */
  function fullReset() {
    base         = S.makeInitialState();
    picks        = [];
    selectedNeed = null;
    lastResult   = null;
    animBusy     = false;
    resetAgents();
    initBadges();
    syncBadges(base);
    var strip = document.getElementById("icon-strip");
    strip.innerHTML = '<span class="strip-idle">Nothing yet. Pick a need below.</span>';
    render();
  }

  /* ── end day ─────────────────────────────────────────── */
  function endDay(usePicks) {
    if (!usePicks || !usePicks.length || lastResult || animBusy) return;
    animBusy   = true;
    lastResult = S.runDay(base, usePicks);
    selectedNeed = null;
    animStrip(lastResult.events);
    render();
  }

  /* ── queue action ────────────────────────────────────── */
  function queue(verb) {
    if (!selectedNeed || lastResult || animBusy) return;
    if (S.MAX_ACTIONS - picks.length <= 0) return;
    picks.push({ verb: verb, target: selectedNeed });
    selectedNeed = null;
    render();
  }

  /* ── wire ────────────────────────────────────────────── */
  document.getElementById("btnMark").onclick      = function () { queue("MARK"); };
  document.getElementById("btnIntervene").onclick = function () { queue("INTERVENE"); };
  document.getElementById("btnUndo").onclick      = function () {
    if (lastResult || animBusy) return;
    picks.pop(); selectedNeed = null; render();
  };
  document.getElementById("btnRun").onclick = function () { endDay(picks); };
  document.getElementById("btnReset").onclick = fullReset;

  document.getElementById("pathA").onclick = function () {
    fullReset();
    picks = S.pathAActions();
    endDay(picks.slice());
  };
  document.getElementById("pathB").onclick = function () {
    fullReset();
    picks = S.pathBActions();
    endDay(picks.slice());
  };

  /* ── init ────────────────────────────────────────────── */
  initBadges();
  syncBadges(base);
  render();
})();
</script>
</body>
</html>
