<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 600" preserveAspectRatio="xMidYMid slice">
  <!-- Goblin Warren bundled garden backdrop — offline fallback layer.
       authority=false · claim=NO_CLAIM · non-sovereign -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1130"/>
      <stop offset="0.55" stop-color="#151028"/>
      <stop offset="1" stop-color="#0d0a1c"/>
    </linearGradient>
    <radialGradient id="treeglow" cx="0.5" cy="0.22" r="0.45">
      <stop offset="0" stop-color="#b98cff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#8b7cff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb15c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb15c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a44"/>
      <stop offset="1" stop-color="#170f2e"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2154"/>
      <stop offset="1" stop-color="#1b1338"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2b1e"/>
      <stop offset="1" stop-color="#131b12"/>
    </linearGradient>
  </defs>

  <rect width="390" height="600" fill="url(#sky)"/>
  <rect width="390" height="600" fill="url(#treeglow)"/>

  <!-- stars -->
  <g fill="#efe9ff">
    <circle cx="38" cy="52" r="1.1" opacity="0.7"/>
    <circle cx="92" cy="30" r="0.8" opacity="0.5"/>
    <circle cx="150" cy="70" r="1.0" opacity="0.6"/>
    <circle cx="236" cy="38" r="0.9" opacity="0.55"/>
    <circle cx="300" cy="64" r="1.2" opacity="0.7"/>
    <circle cx="352" cy="26" r="0.8" opacity="0.5"/>
    <circle cx="330" cy="110" r="0.9" opacity="0.45"/>
    <circle cx="60" cy="120" r="0.8" opacity="0.45"/>
    <circle cx="196" cy="20" r="1.0" opacity="0.6"/>
  </g>

  <!-- distant hills -->
  <path d="M0 320 Q 70 270 160 305 T 390 292 V 600 H 0 Z" fill="url(#hillB)"/>
  <path d="M0 370 Q 110 320 210 356 T 390 344 V 600 H 0 Z" fill="url(#hillA)"/>

  <!-- mossy ground -->
  <path d="M0 430 Q 100 402 200 424 T 390 416 V 600 H 0 Z" fill="url(#ground)"/>

  <!-- winding path -->
  <path d="M195 600 C 175 540 235 500 205 452 C 190 428 200 420 208 412"
        fill="none" stroke="#3a2f1e" stroke-width="26" stroke-linecap="round" opacity="0.65"/>
  <path d="M195 600 C 175 540 235 500 205 452 C 190 428 200 420 208 412"
        fill="none" stroke="#57452b" stroke-width="14" stroke-linecap="round" opacity="0.5"/>

  <!-- glow lanterns -->
  <circle cx="86" cy="452" r="40" fill="url(#lantern)"/>
  <circle cx="312" cy="486" r="34" fill="url(#lantern)"/>
  <circle cx="86" cy="452" r="3.2" fill="#ffd9a0"/>
  <circle cx="312" cy="486" r="2.8" fill="#ffd9a0"/>

  <!-- mushroom cluster -->
  <g opacity="0.9">
    <rect x="52" y="500" width="6" height="14" rx="3" fill="#d8cdb4"/>
    <ellipse cx="55" cy="499" rx="13" ry="8" fill="#a05468"/>
    <circle cx="50" cy="496" r="2" fill="#efdfe4"/>
    <circle cx="60" cy="498" r="1.6" fill="#efdfe4"/>
    <rect x="70" y="508" width="4.4" height="10" rx="2.2" fill="#d8cdb4"/>
    <ellipse cx="72" cy="507" rx="9" ry="5.6" fill="#8b5a9e"/>
  </g>

  <!-- fireflies -->
  <g fill="#d6ff8a">
    <circle cx="140" cy="470" r="1.4" opacity="0.8"/>
    <circle cx="255" cy="440" r="1.2" opacity="0.7"/>
    <circle cx="300" cy="530" r="1.4" opacity="0.75"/>
    <circle cx="110" cy="540" r="1.1" opacity="0.6"/>
  </g>
</svg>
