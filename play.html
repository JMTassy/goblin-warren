<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Goblin Warren — Start</title>
<!--
  Levels 1–2 shell · paper-collage skin (approved stills, GO SKIN)
  Level 3 = day1.html (unchanged sim). ramp_sim.js untouched.
  authority=false · claim=NO_CLAIM · experience before terminology
  One new thing per level. Never two.
-->
<style>
  :root {
    --bg: #efe7d8; --ink: #2a241c; --dim: #7a6f5c;
    --gold: #b8860b; --green: #2e5940; --warn: #c25e28;
    --edge: #d8ceba; --card: #faf6ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, sans-serif; padding: 18px;
    max-width: 580px; margin-inline: auto;
    display: flex; flex-direction: column;
  }
  h1 { font-size: 1.1rem; color: var(--ink); margin: 0 0 2px; font-weight: 800; }
  .lvl-tag { font-size: 0.72rem; color: var(--dim); letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 12px; }

  .stage {
    position: relative; height: 300px;
    background: #2e5940 url("assets/collage_stills/wall_garden.png") center/cover no-repeat;
    border: 1px solid var(--edge);
    border-radius: 14px; overflow: hidden; margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(60,50,30,0.18);
  }

  .prop {
    position: absolute; transition: filter 0.3s;
  }
  .prop img {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(3px 5px 4px rgba(20,16,8,0.35));
    transition: transform 0.25s, filter 0.3s;
  }
  .prop.glowing img {
    filter: drop-shadow(3px 5px 4px rgba(20,16,8,0.35))
            drop-shadow(0 0 10px #c25e28) drop-shadow(0 0 22px #c25e2888);
  }
  .prop.shake img { animation: shake 0.45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-2deg); }
    40% { transform: translateX(6px) rotate(2deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .prop-check {
    position: absolute; top: -8px; right: -8px; font-size: 0.9rem;
    color: #fff; background: #2e7d4f; border: 2px solid #fff;
    border-radius: 50%; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.3s; z-index: 5;
    box-shadow: 0 2px 5px rgba(20,16,8,0.3);
  }
  .prop.resolved .prop-check { opacity: 1; }

  .agent {
    position: absolute; width: 92px;
    transition: left 1.1s cubic-bezier(0.45,0,0.25,1), bottom 1.1s ease,
                filter 0.3s, opacity 0.4s;
  }
  .agent img {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(4px 6px 5px rgba(20,16,8,0.4));
  }
  .agent.working img {
    filter: drop-shadow(4px 6px 5px rgba(20,16,8,0.4))
            drop-shadow(0 0 12px #e6c84a);
  }
  .agent.wander { animation: wander 5s ease-in-out infinite alternate; }
  @keyframes wander { from { left: 58%; } to { left: 70%; } }
  .agent.bob img { animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .droplet, .pulse-fx {
    position: absolute; pointer-events: none; opacity: 0;
  }
  .droplet { font-size: 1.8rem; }
  .droplet.fire { animation: drop 0.7s ease-in forwards; }
  @keyframes drop {
    0% { opacity: 1; transform: translateY(-40px) scale(0.8); }
    75% { opacity: 1; transform: translateY(0) scale(1.05); }
    100% { opacity: 0; transform: translateY(4px) scale(1.2); }
  }
  .pulse-fx { width: 90px; }
  .pulse-fx img { display: block; width: 100%; height: auto; }
  .pulse-fx.fire { animation: pulsefx 0.9s ease-out forwards; }
  @keyframes pulsefx {
    0%   { opacity: 0; transform: scale(0.3) rotate(-15deg); }
    25%  { opacity: 1; transform: scale(1.1) rotate(0deg); }
    70%  { opacity: 1; transform: scale(1.35) rotate(8deg); }
    100% { opacity: 0; transform: scale(1.7) rotate(12deg); }
  }

  .speech {
    position: absolute; background: var(--card); border: 1px solid var(--edge);
    border-radius: 10px; padding: 6px 12px; font-size: 0.82rem;
    color: var(--ink);
    opacity: 0; transition: opacity 0.3s; max-width: 200px;
    pointer-events: none; z-index: 10;
    box-shadow: 0 3px 8px rgba(20,16,8,0.25);
  }
  .speech.show { opacity: 1; }

  .hint { min-height: 26px; font-size: 0.95rem; color: var(--dim);
    margin-bottom: 10px; transition: color 0.3s; }
  .hint.warm { color: var(--warn); font-weight: 600; }

  .verb-row { display: flex; gap: 10px; }
  .verb-row button {
    flex: 1; padding: 16px 10px; font: 700 1.02rem system-ui;
    border-radius: 12px; border: 2px solid var(--edge);
    background: var(--card); color: var(--ink); cursor: pointer;
    transition: background 0.15s, opacity 0.2s, transform 0.1s;
    box-shadow: 0 3px 8px rgba(60,50,30,0.12);
  }
  .verb-row button:active:not(:disabled) { transform: scale(0.97); }
  .verb-row button:disabled { opacity: 0.35; cursor: not-allowed; }
  .verb-row button.fix  { border-color: #2e5940; color: #2e5940; }
  .verb-row button.mark { border-color: #c25e28; color: #c25e28; background: #faf0e4; }
  .verb-row button.mark.arrive { animation: arrive 0.8s ease-out; }
  @keyframes arrive {
    0% { opacity: 0; transform: translateY(10px) scale(0.9); }
    60% { opacity: 1; transform: translateY(-3px) scale(1.04); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .banner {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(42, 36, 28, 0.55); z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity 0.4s;
  }
  .banner.show { opacity: 1; pointer-events: auto; }
  .banner .panel {
    background: var(--card); border-radius: 16px; padding: 28px 34px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 12px 40px rgba(20,16,8,0.4); max-width: 340px;
    border: 1px solid var(--edge);
  }
  .banner img.bn-img { width: 110px; height: auto; }
  .banner .msg { font-size: 1.1rem; color: var(--ink); font-weight: 800; text-align: center; }
  .banner .sub2 { font-size: 0.87rem; color: var(--dim); text-align: center; }
  .banner button {
    padding: 14px 26px; font: 700 1rem system-ui; border-radius: 12px;
    border: 2px solid #2e5940; background: #2e5940; color: #f0ead8; cursor: pointer;
  }
</style>
</head>
<body>

<h1 id="title">The Seedlings</h1>
<div class="lvl-tag" id="lvlTag">Level 1</div>

<div class="stage" id="stage">
  <div class="droplet" id="droplet">💧</div>
  <div class="pulse-fx" id="pulseFx"><img src="assets/collage_stills/cut/mark_pulse.png" alt="" /></div>
  <div class="speech" id="speech"></div>
</div>

<div class="hint" id="hint"></div>

<div class="verb-row" id="verbRow"></div>

<div class="banner" id="banner">
  <div class="panel">
    <img class="bn-img" id="bnImg" src="assets/collage_stills/cut/seedlings_bloomed.png" alt="" />
    <div class="msg" id="bnMsg"></div>
    <div class="sub2" id="bnSub"></div>
    <button type="button" id="bnNext"></button>
  </div>
</div>

<script src="ramp_sim.js"></script>
<script>
(function () {
  "use strict";
  var R = window.RampSim;
  if (!R) { document.getElementById("hint").textContent = "ramp_sim.js failed to load."; return; }

  var ART = "assets/collage_stills/cut/";

  var stage   = document.getElementById("stage");
  var hint    = document.getElementById("hint");
  var verbRow = document.getElementById("verbRow");
  var banner  = document.getElementById("banner");
  var speech  = document.getElementById("speech");
  var busy    = false;

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function say(x, y, text, ms) {
    speech.style.left = x; speech.style.top = y;
    speech.textContent = text;
    speech.classList.add("show");
    setTimeout(function () { speech.classList.remove("show"); }, ms || 1600);
  }

  function fireDroplet(left, top) {
    var n = document.getElementById("droplet");
    n.style.left = left; n.style.top = top;
    n.classList.remove("fire");
    void n.offsetWidth;
    n.classList.add("fire");
  }

  function firePulse(left, top) {
    var n = document.getElementById("pulseFx");
    n.style.left = left; n.style.top = top;
    n.classList.remove("fire");
    void n.offsetWidth;
    n.classList.add("fire");
  }

  function showBanner(imgFile, msg, sub, btnText, onNext) {
    document.getElementById("bnImg").src = ART + imgFile;
    document.getElementById("bnMsg").textContent = msg;
    document.getElementById("bnSub").textContent = sub;
    var b = document.getElementById("bnNext");
    b.textContent = btnText;
    b.onclick = function () { banner.classList.remove("show"); onNext(); };
    banner.classList.add("show");
  }

  /* ═══ LEVEL 1 — The Seedlings ═══════════════════════════ */
  function loadLevel1() {
    var state = R.makeLevel1();
    document.getElementById("title").textContent = "The Seedlings";
    document.getElementById("lvlTag").textContent = "Level 1";
    stage.querySelectorAll(".prop, .agent").forEach(function (n) { n.remove(); });

    var seed = el("div", "prop",
      '<img id="seedImg" src="' + ART + 'seedlings_dry.png" alt="dry seedlings" />' +
      '<div class="prop-check">✓</div>');
    seed.style.left = "40%"; seed.style.bottom = "18px"; seed.style.width = "120px";
    stage.appendChild(seed);

    hint.textContent = "The seedlings are dry.";
    hint.classList.remove("warm");

    verbRow.innerHTML = "";
    var b = el("button", "fix", "✋ Fix it");
    b.onclick = function () {
      if (busy) return;
      busy = true;
      R.runLevel1(state, { verb: "FIX", target: "dry_seedlings" });
      b.disabled = true;
      fireDroplet("46%", "30%");
      setTimeout(function () {
        document.getElementById("seedImg").src = ART + "seedlings_bloomed.png";
        seed.classList.add("resolved");
        hint.textContent = "They drink. They grow.";
        hint.classList.add("warm");
      }, 650);
      setTimeout(function () {
        busy = false;
        showBanner("seedlings_bloomed.png", "You fixed it!",
          "Some problems just need your hands.",
          "Level 2 →", loadLevel2);
      }, 1700);
    };
    verbRow.appendChild(b);
  }

  /* ═══ LEVEL 2 — The Heavy Rock ══════════════════════════ */
  function loadLevel2() {
    var state = R.makeLevel2();
    document.getElementById("title").textContent = "The Heavy Rock";
    document.getElementById("lvlTag").textContent = "Level 2";
    stage.querySelectorAll(".prop, .agent").forEach(function (n) { n.remove(); });

    var rock = el("div", "prop",
      '<img src="' + ART + 'rock_cracked.png" alt="cracked rock" />' +
      '<div class="prop-check">✓</div>');
    rock.style.left = "12%"; rock.style.bottom = "14px"; rock.style.width = "150px";
    stage.appendChild(rock);

    var bram = el("div", "agent wander bob",
      '<img src="' + ART + 'bram.png" alt="Bram" />');
    bram.style.bottom = "16px";
    bram.title = "Bram";
    stage.appendChild(bram);

    hint.textContent = "A root cracked under this rock. It looks heavy…";
    hint.classList.remove("warm");

    verbRow.innerHTML = "";
    var bFix = el("button", "fix", "✋ Fix it");
    var bMark = el("button", "mark", "✨ Mark it");
    bMark.style.display = "none"; // MARK is discovered, not offered
    verbRow.appendChild(bFix);
    verbRow.appendChild(bMark);

    bFix.onclick = function () {
      if (busy || state.complete) return;
      busy = true;
      state = R.runLevel2(state, { verb: "FIX", target: "cracked_root" });
      rock.classList.remove("shake");
      void rock.offsetWidth;
      rock.classList.add("shake");
      hint.textContent = "Too heavy for you.";
      hint.classList.remove("warm");
      setTimeout(function () {
        say("48%", "18%", "Bram is strong…", 1800);
        if (bMark.style.display === "none") {
          bMark.style.display = "";
          bMark.classList.add("arrive");
          hint.textContent = "Too heavy for you. Could Bram notice it if you marked it?";
          hint.classList.add("warm");
        }
        busy = false;
      }, 700);
    };

    bMark.onclick = function () {
      if (busy || state.complete) return;
      busy = true;
      state = R.runLevel2(state, { verb: "MARK", target: "cracked_root" });
      bFix.disabled = true;
      bMark.disabled = true;

      firePulse("14%", "34%");
      rock.classList.add("glowing");
      hint.textContent = "A sign glows on the rock.";
      hint.classList.remove("warm");

      setTimeout(function () {
        bram.classList.remove("wander");
        bram.style.left = "60%";
        say("56%", "12%", "Hm? What's that?", 1200);
      }, 800);

      setTimeout(function () {
        bram.style.left = "24%";
        hint.textContent = "Bram saw your mark!";
        hint.classList.add("warm");
      }, 1700);

      setTimeout(function () {
        bram.classList.add("working");
        say("22%", "14%", "Heavy? Not for me.", 1400);
      }, 3000);

      setTimeout(function () {
        rock.classList.remove("glowing");
        rock.classList.add("resolved");
        bram.classList.remove("working");
        firePulse("14%", "30%");
        hint.textContent = "Bram fixed it — because you marked it.";
      }, 4200);

      setTimeout(function () {
        busy = false;
        showBanner("mark_pulse.png", "Bram heard you!",
          "You didn't lift the rock. You made Bram notice it. That's a different kind of power.",
          "Level 3 →", function () { window.location.href = "day1.html"; });
      }, 5400);
    };
  }

  loadLevel1();
})();
</script>
</body>
</html>
