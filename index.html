<!doctype html>
<!--
  Dream of Conquest — The Goblin Warren (V1, Milestone 1)
  authority=false · claim=NO_CLAIM · non-sovereign
  One goblin (Lulu), one location (Garden Plot), the full loop:
  observe → propose → decide (TRY/HOLD/COMPOST) → enact → record.
  Local-only persistence (localStorage). No accounts, no backend, no timers.
  All game logic lives in the pure reducer zone below (no DOM, no browser APIs)
  and is headlessly tested by selftest.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goblin Warren</title>
<style>
  :root{
    --bg:#0e1410; --panel:#16211a; --panel2:#1c2b22; --ink:#e8f0e4; --dim:#93a696;
    --leaf:#7fc46a; --amber:#e0a94f; --moss:#3a5c42; --bad:#c96a5a; --violet:#a98fd6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:ui-rounded,-apple-system,"Segoe UI",sans-serif; min-height:100%;}
  #app{max-width:520px; margin:0 auto; padding:12px 14px calc(24px + env(safe-area-inset-bottom));}
  header{display:flex; justify-content:space-between; align-items:baseline; padding:4px 2px 10px;}
  header h1{font-size:19px; margin:0; letter-spacing:.5px; color:var(--leaf);}
  #daybadge{font-size:13px; color:var(--dim);}
  #resources{display:flex; gap:8px; margin-bottom:10px;}
  .res{flex:1; background:var(--panel); border-radius:12px; padding:8px 6px; text-align:center;}
  .res b{display:block; font-size:17px;}
  .res span{font-size:11px; color:var(--dim);}
  #scene{background:linear-gradient(180deg,#14231a 0%,#0f1a13 100%);
    border:1px solid var(--moss); border-radius:16px; padding:16px 14px 12px; text-align:center; position:relative;}
  #scene .loc{font-size:12px; color:var(--dim); letter-spacing:1px; text-transform:uppercase;}
  #lulu{width:120px; height:120px; margin:6px auto 2px; display:block; cursor:pointer;
    transition:transform .15s ease;}
  #lulu:active{transform:scale(1.08)}
  #moodline{font-size:15px; min-height:22px;}
  #moodline b{color:var(--amber);}
  #speech{background:var(--panel2); border-radius:14px; padding:12px 14px; margin:12px 0 10px;
    font-size:15px; line-height:1.45; min-height:44px; text-align:left; position:relative;}
  #speech:before{content:""; position:absolute; top:-8px; left:38px; border:8px solid transparent;
    border-bottom-color:var(--panel2); border-top:none;}
  #decide{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  #decide button{font-size:16px; padding:14px; border-radius:14px; border:none; color:var(--ink);
    font-weight:600; cursor:pointer; min-height:52px;}
  #btn-try{background:#2c5d3a;} #btn-hold{background:#4a4632;} #btn-compost{background:#4a3232;}
  #care{display:flex; gap:8px; margin-bottom:12px;}
  #care button{flex:1; font-size:14px; padding:11px 4px; border-radius:12px; border:1px solid var(--moss);
    background:var(--panel); color:var(--ink); cursor:pointer; min-height:46px;}
  #memories{margin:2px 0 10px; font-size:13px; color:var(--violet); min-height:16px;}
  #log{background:var(--panel); border-radius:12px; padding:10px 12px; font-size:12.5px;
    color:var(--dim); max-height:180px; overflow-y:auto; line-height:1.6;}
  #log .k{color:var(--leaf);}
  footer{margin-top:14px; text-align:center; font-size:11px; color:var(--dim);}
  footer a{color:var(--dim);}
  button:disabled{opacity:.4; cursor:default;}
</style>
</head>
<body>
<div id="app">
  <header><h1>Goblin Warren</h1><div id="daybadge"></div></header>
  <div id="resources"></div>
  <div id="scene">
    <div class="loc">Garden Plot</div>
    <svg id="lulu" viewBox="0 0 32 32" shape-rendering="crispEdges" aria-label="Lulu the goblin">
      <!-- original pixel goblin: Lulu -->
      <rect x="10" y="4" width="12" height="3" fill="#3f7a3f"/>
      <rect x="6" y="7" width="4" height="6" fill="#4e9a4e"/><rect x="22" y="7" width="4" height="6" fill="#4e9a4e"/>
      <rect x="9" y="7" width="14" height="10" fill="#63b063"/>
      <rect x="12" y="10" width="2" height="3" fill="#10240f"/><rect x="18" y="10" width="2" height="3" fill="#10240f"/>
      <rect x="14" y="14" width="4" height="1" fill="#2c5d2c"/>
      <rect x="11" y="17" width="10" height="8" fill="#7a5c34"/>
      <rect x="9" y="18" width="2" height="5" fill="#63b063"/><rect x="21" y="18" width="2" height="5" fill="#63b063"/>
      <rect x="12" y="25" width="3" height="3" fill="#4e3a20"/><rect x="17" y="25" width="3" height="3" fill="#4e3a20"/>
      <rect x="4" y="26" width="5" height="2" fill="#e78fb0"/><rect x="5" y="24" width="3" height="2" fill="#e78fb0"/>
      <rect x="6" y="28" width="1" height="2" fill="#3f7a3f"/>
    </svg>
    <div id="moodline"></div>
  </div>
  <div id="speech"></div>
  <div id="decide">
    <button id="btn-try">🌱 Try it</button>
    <button id="btn-hold">🕯️ Hold it</button>
    <button id="btn-compost">🍂 Compost it</button>
  </div>
  <div id="care">
    <button id="btn-listen">👂 Listen</button>
    <button id="btn-matcha">🍵 Matcha</button>
    <button id="btn-celebrate">🎉 Celebrate</button>
  </div>
  <div id="memories"></div>
  <div id="log"></div>
  <footer><a href="#" id="restart">start a fresh warren</a></footer>
</div>

<script>
/* ===== REDUCER-BEGIN =====================================================
   Pure game logic. No DOM, no window, no localStorage, no Math.random,
   no Date — every function that needs time receives `now` (ms epoch).
   selftest.js extracts this zone by these markers and runs it under Node.
   ========================================================================== */

const GW_VERSION = "GW_V1_M1";
const MOODS = ["curious","focused","happy","calm","worried","tired"];
const EVENT_KINDS = ["WARREN_STARTED","WARREN_LOADED","DAY_PASSED","PROPOSAL_MADE",
  "PROPOSAL_TRIED","PROPOSAL_HELD","PROPOSAL_COMPOSTED","COMPOST_BLOOMED",
  "CARE_GIVEN","MEMORY_BORN"];
const EVENT_CAP = 250;
const CARE_VERBS = { listen:{mood:8, energy:0, line:"Lulu leans in and tells you everything."},
                     matcha:{mood:3, energy:18, line:"Lulu sips the matcha. Tiny happy noises."},
                     celebrate:{mood:10, energy:0, line:"Lulu does the victory stomp dance."} };

const PROPOSALS = [
  {id:"P01", text:"Plant a moonseed by the crooked fence?", seeds:1, bugs:0, ideas:0, mood:6},
  {id:"P02", text:"Follow the glowbug trail past the big root?", seeds:0, bugs:1, ideas:0, mood:6},
  {id:"P03", text:"Dig a tiny peek-hole toward the brook?", seeds:0, bugs:0, ideas:1, mood:5},
  {id:"P04", text:"Stack three pretty stones into a wish-pile?", seeds:0, bugs:0, ideas:1, mood:5},
  {id:"P05", text:"Sing the sprout-song to the shy fern?", seeds:1, bugs:0, ideas:0, mood:7},
  {id:"P06", text:"Trade a shiny pebble with the snail for gossip?", seeds:0, bugs:1, ideas:0, mood:6},
  {id:"P07", text:"Draw a map of the warren in the mud?", seeds:0, bugs:0, ideas:1, mood:5},
  {id:"P08", text:"Build a rain-hat for the smallest mushroom?", seeds:1, bugs:0, ideas:0, mood:7},
  {id:"P09", text:"Whisper a secret into the echo-stump?", seeds:0, bugs:0, ideas:1, mood:6},
  {id:"P10", text:"Make a moss pillow for a tired beetle?", seeds:0, bugs:1, ideas:0, mood:7},
  {id:"P11", text:"Braid dew-grass into a lucky bracelet?", seeds:1, bugs:0, ideas:0, mood:5},
  {id:"P12", text:"Leave a berry gift on the neighbor's stump?", seeds:0, bugs:0, ideas:1, mood:6},
];

const MEMORY_LINES = [
  "The day the fern finally waved back.",
  "A glowbug slept in Lulu's hat all afternoon.",
  "The wish-pile hummed, just once, very quietly.",
  "Rain came, and the smallest mushroom stayed dry.",
  "The snail's gossip turned out to be true.",
  "Lulu taught the echo-stump a new word.",
];

function h32(str){
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0;
  }
  return h >>> 0;
}

function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function utcDay(ms){ return Math.floor(ms / 86400000); }

function logEvent(S, kind, msg, now){
  if (EVENT_KINDS.indexOf(kind) < 0) return S;
  S.events.push({ t: now, k: kind, msg: msg });
  if (S.events.length > EVENT_CAP) S.events = S.events.slice(-EVENT_CAP);
  return S;
}

function makeState(now){
  const S = {
    v: GW_VERSION,
    createdAt: now,
    lastSeenAt: now,
    actions: 0,
    day: 1,
    goblin: { id:"lulu", name:"Lulu", role:"Explorer", home:"Garden Plot",
              mood: 50, energy: 80, careStreak: 0 },
    res: { seeds: 1, bugs: 0, ideas: 2, memories: 0 },
    compost: 0,
    heldCount: 0,
    held: [],
    tried: 0,
    current: null,
    memories: [],
    events: [],
  };
  logEvent(S, "WARREN_STARTED", "A tiny warren begins. Lulu waves.", now);
  return S;
}

function moodLabel(S){
  if (S.goblin.energy < 25) return "tired";
  const m = S.goblin.mood;
  if (m >= 70) return "happy";
  if (m >= 45) return "curious";
  if (m >= 20) return "calm";
  if (m >= 0)  return "focused";
  return "worried";
}

/* Advance calendar: new real day → energy regen, care streak resets. */
function tick(S, now){
  const prevDay = utcDay(S.lastSeenAt), curDay = utcDay(now);
  if (curDay > prevDay){
    const passed = curDay - prevDay;
    S.day += passed;
    S.goblin.energy = clamp(S.goblin.energy + 30 * passed, 0, 100);
    S.goblin.careStreak = 0;
    logEvent(S, "DAY_PASSED", "Day " + S.day + " dawns over the warren.", now);
  }
  S.lastSeenAt = now;
  return S;
}

/* Deterministic: same state → same proposal. */
function nextProposal(S, now){
  if (S.current) return S;
  const idx = h32("prop:" + S.actions + ":" + S.day + ":" + S.goblin.id) % PROPOSALS.length;
  const p = PROPOSALS[idx];
  S.current = { id: p.id, text: p.text, seeds: p.seeds, bugs: p.bugs, ideas: p.ideas, mood: p.mood };
  logEvent(S, "PROPOSAL_MADE", "Lulu: “" + p.text + "”", now);
  return S;
}

/* choice ∈ {"try","hold","compost"} — no wrong choices, only different stories. */
function decide(S, choice, now){
  if (!S.current) return S;
  const p = S.current;
  S.current = null;
  S.actions += 1;
  if (choice === "try"){
    S.res.seeds += p.seeds; S.res.bugs += p.bugs; S.res.ideas += p.ideas;
    S.goblin.mood = clamp(S.goblin.mood + p.mood, -100, 100);
    S.goblin.energy = clamp(S.goblin.energy - 6, 0, 100);
    S.tried += 1;
    logEvent(S, "PROPOSAL_TRIED", "You tried it. The Garden Plot shifts a little.", now);
    if (S.tried % 3 === 0){
      const mi = h32("mem:" + S.tried + ":" + S.day) % MEMORY_LINES.length;
      S.memories.push(MEMORY_LINES[mi]);
      S.res.memories += 1;
      logEvent(S, "MEMORY_BORN", "A memory is born: " + MEMORY_LINES[mi], now);
    }
  } else if (choice === "hold"){
    S.heldCount += 1;
    S.held.push(p.id);
    if (S.held.length > 5) S.held = S.held.slice(-5);
    if (S.heldCount > 3) S.goblin.mood = clamp(S.goblin.mood - 2, -100, 100);
    logEvent(S, "PROPOSAL_HELD", "Set aside, held for later. Lulu nods.", now);
  } else if (choice === "compost"){
    S.compost += 1;
    S.goblin.mood = clamp(S.goblin.mood + 2, -100, 100);
    logEvent(S, "PROPOSAL_COMPOSTED", "The idea returns to the soil.", now);
    if (S.compost % 3 === 0){
      S.res.seeds += 1;
      logEvent(S, "COMPOST_BLOOMED", "Old ideas break down. A new seed appears.", now);
    }
  } else {
    S.actions -= 1;
    S.current = p;
    return S;
  }
  return S;
}

/* Care verbs: kind attention lifts Lulu, with diminishing returns per day. */
function care(S, verb, now){
  const def = CARE_VERBS[verb];
  if (!def) return S;
  const streak = S.goblin.careStreak;
  const moodGain = Math.max(1, def.mood - 3 * streak);
  const energyGain = def.energy > 0 ? Math.max(2, def.energy - 5 * streak) : 0;
  S.goblin.mood = clamp(S.goblin.mood + moodGain, -100, 100);
  S.goblin.energy = clamp(S.goblin.energy + energyGain, 0, 100);
  S.goblin.careStreak = streak + 1;
  S.actions += 1;
  logEvent(S, "CARE_GIVEN", def.line, now);
  return S;
}

function serialize(S){ return JSON.stringify(S); }

/* Fail-closed loader: anything malformed → null (caller starts fresh). */
function loadState(json, now){
  let S;
  try { S = JSON.parse(json); } catch (e) { return null; }
  if (!S || typeof S !== "object") return null;
  if (S.v !== GW_VERSION) return null;
  if (typeof S.createdAt !== "number" || typeof S.actions !== "number") return null;
  if (!S.goblin || typeof S.goblin.mood !== "number" || typeof S.goblin.energy !== "number") return null;
  if (!S.res || typeof S.res.seeds !== "number") return null;
  if (!Array.isArray(S.events) || !Array.isArray(S.memories)) return null;
  logEvent(S, "WARREN_LOADED", "The warren remembers you.", now);
  return tick(S, now);
}

/* ===== REDUCER-END ====================================================== */

/* ---------- render + UI zone (all state changes route through reducers) -- */
(function(){
  if (typeof document === "undefined") return; // headless (selftest) — UI skipped
  const KEY = "goblin_warren_v1";
  let S = loadState(localStorage.getItem(KEY) || "", Date.now()) || makeState(Date.now());
  nextProposal(S, Date.now());

  function save(){ localStorage.setItem(KEY, serialize(S)); }

  function dispatch(fn){
    S = fn(S, Date.now()) || S;
    tick(S, Date.now());
    nextProposal(S, Date.now());
    save();
    render();
  }

  const $ = (id) => document.getElementById(id);
  function fmtTime(t){
    const d = new Date(t);
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  }

  function render(){
    $("daybadge").textContent = "Day " + S.day;
    $("resources").innerHTML =
      '<div class="res"><b>' + S.res.seeds + '</b><span>🌱 seeds</span></div>' +
      '<div class="res"><b>' + S.res.bugs + '</b><span>🐛 bugs</span></div>' +
      '<div class="res"><b>' + S.res.ideas + '</b><span>💡 ideas</span></div>' +
      '<div class="res"><b>' + S.res.memories + '</b><span>💜 memories</span></div>';
    $("moodline").innerHTML = "Lulu feels <b>" + moodLabel(S) + "</b> · energy " + S.goblin.energy;
    $("speech").textContent = S.current ? S.current.text : "…";
    const deciding = !!S.current;
    $("btn-try").disabled = !deciding; $("btn-hold").disabled = !deciding; $("btn-compost").disabled = !deciding;
    $("memories").textContent = S.memories.length
      ? "Latest memory: " + S.memories[S.memories.length-1] : "";
    $("log").innerHTML = S.events.slice(-30).reverse().map(function(e){
      return '<div><span class="k">' + fmtTime(e.t) + "</span> " + e.msg + "</div>";
    }).join("");
  }

  $("btn-try").onclick      = () => dispatch((s,n)=>decide(s,"try",n));
  $("btn-hold").onclick     = () => dispatch((s,n)=>decide(s,"hold",n));
  $("btn-compost").onclick  = () => dispatch((s,n)=>decide(s,"compost",n));
  $("btn-listen").onclick   = () => dispatch((s,n)=>care(s,"listen",n));
  $("btn-matcha").onclick   = () => dispatch((s,n)=>care(s,"matcha",n));
  $("btn-celebrate").onclick= () => dispatch((s,n)=>care(s,"celebrate",n));
  $("lulu").onclick         = () => dispatch((s,n)=>care(s,"listen",n));
  $("restart").onclick = function(ev){
    ev.preventDefault();
    if (confirm("Start a fresh warren? Lulu's memories will fade.")){
      localStorage.removeItem(KEY);
      S = makeState(Date.now());
      nextProposal(S, Date.now());
      save(); render();
    }
  };

  render();
})();
</script>
</body>
</html>
